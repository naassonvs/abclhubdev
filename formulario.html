    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<script>

/* ===== INÍCIO MODELO v2 (compartilhado) ===== */
// ══════════════════════════════════════════════════════════════
// MODELO DE PERGUNTAS v2 — normalização e helpers COMPARTILHADOS
// ⚠ Este bloco é IDÊNTICO em admin.html e formulario.html.
//   Ao alterar aqui, replique no outro arquivo.
//
// O que mudou em relação ao v1:
//  • `opcoes` deixa de ser string[] e passa a ser objeto[]:
//      { id, texto, valorCent, exclusiva }
//    → o preço sai de DENTRO do texto ("Estadia — R$ 200,00") e vira número.
//    → cada opção ganha id estável (base para financeiro, estatística e vagas).
//  • `tipo:'financeiro'` deixa de existir: vira `tipo:'checkbox'` + `comValor:true`.
//    O vínculo financeiro passa a ser ATRIBUTO, aplicável a radio/checkbox/select.
//  • Novos atributos opcionais em qualquer pergunta:
//      imagemUrl  → imagem da pergunta ('', http(s), data: legado, ou 'ref:<docId>')
//      condicao   → { perguntaId, opcoes:[idsOpcao], negar:bool }
//      regras     → { maxSelecoes:n }
//
// Valores em CENTAVOS INTEIROS (valorCent) — evita erro de ponto flutuante
// em somas do tipo 65,10 + 65,20 + 65,30.
// ══════════════════════════════════════════════════════════════
var PQ_MODELO_VERSAO = 2;
console.log('[FORM] build 2026-09-01 · modelo de perguntas v' + PQ_MODELO_VERSAO);

function pqNovoOpcaoId() {
  return 'o_' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 4);
}

function pqFmtBRL(cent) {
  return (Math.round(Number(cent) || 0) / 100).toFixed(2).replace('.', ',');
}

// "R$ 1.234,56" (string do usuário) → centavos
function pqParseBRL(str) {
  const s = String(str || '').replace(/[^\d.,]/g, '');
  if (!s) return 0;
  const norm = s.replace(/\./g, '').replace(',', '.');
  return Math.round((parseFloat(norm) || 0) * 100);
}

// Migração v1: extrai o valor escrito DENTRO do texto da opção.
// Cobre "Estadia completa — R$ 200,00", "Diária (…) R$200" e "Item (R$ 65,00)".
function pqValorLegado(str) {
  const s = String(str || '');
  const m = s.match(/R\$\s*([\d.]*\d(?:,\d{1,2})?)/);
  if (!m) return { texto: s.trim(), valorCent: 0 };
  const valorCent = Math.round((parseFloat(m[1].replace(/\./g, '').replace(',', '.')) || 0) * 100);
  let texto = (s.slice(0, m.index) + s.slice(m.index + m[0].length))
    .replace(/\(\s*\)/g, '')
    .replace(/[\s—–\-]+$/, '')
    .trim();
  return { texto: texto || s.trim(), valorCent: valorCent };
}

function pqTiposComOpcoes(t) { return ['radio', 'checkbox', 'select', 'financeiro'].indexOf(t) >= 0; }
function pqPodeTerValor(t)   { return ['radio', 'checkbox', 'select'].indexOf(t) >= 0; }
function pqEhConteudo(t)     { return t === 'secao' || t === 'imagem'; }

function pqNormalizarOpcoes(p) {
  const raw = Array.isArray(p.opcoes) ? p.opcoes : [];
  const temValor = !!p.comValor || p.tipo === 'financeiro';
  return raw.map(function (o) {
    if (o && typeof o === 'object') {
      return {
        id: o.id || pqNovoOpcaoId(),
        texto: String(o.texto == null ? '' : o.texto),
        valorCent: Math.round(Number(o.valorCent) || 0),
        exclusiva: !!o.exclusiva
      };
    }
    const conv = temValor ? pqValorLegado(o) : { texto: String(o == null ? '' : o).trim(), valorCent: 0 };
    return { id: pqNovoOpcaoId(), texto: conv.texto, valorCent: conv.valorCent, exclusiva: false };
  });
}

// Normaliza UMA pergunta. Retorna { pergunta, mudou }.
function pqNormalizarPergunta(p) {
  const q = Object.assign({}, p || {});
  const antes = JSON.stringify([q.tipo, q.opcoes || [], q.comValor, q.regras || null]);

  if (q.tipo === 'financeiro') { q.tipo = 'checkbox'; q.comValor = true; }
  q.comValor = !!q.comValor && pqPodeTerValor(q.tipo);
  if (q.comValor && !q.destinoValor) q.destinoValor = 'inscricao';
  if (!q.comValor) delete q.destinoValor;

  q.opcoes = pqTiposComOpcoes(q.tipo) ? pqNormalizarOpcoes(q) : [];

  // regras: só fazem sentido em múltipla escolha
  const max = q.regras && Number(q.regras.maxSelecoes);
  if (q.tipo === 'checkbox' && max > 0) q.regras = { maxSelecoes: Math.round(max) };
  else delete q.regras;

  // condição: precisa apontar para uma pergunta
  if (q.condicao && q.condicao.perguntaId) {
    q.condicao = {
      perguntaId: q.condicao.perguntaId,
      opcoes: Array.isArray(q.condicao.opcoes) ? q.condicao.opcoes.slice() : [],
      negar: !!q.condicao.negar
    };
  } else { delete q.condicao; }

  if (!q.imagemUrl) delete q.imagemUrl;

  const depois = JSON.stringify([q.tipo, q.opcoes, q.comValor, q.regras || null]);
  return { pergunta: q, mudou: antes !== depois };
}

// Normaliza a LISTA. Retorna { perguntas, mudou }.
function pqNormalizarPerguntas(lista) {
  let mudou = false;
  const out = (Array.isArray(lista) ? lista : []).map(function (p) {
    const r = pqNormalizarPergunta(p);
    if (r.mudou) mudou = true;
    return r.pergunta;
  });
  return { perguntas: out, mudou: mudou };
}

// ── Imagens em documento separado (coleção `forms_midias`) ──
// O documento do formulário tem teto de 1 MiB no Firestore e a capa já
// consome boa parte dele. Cada imagem de pergunta vira um doc próprio e a
// pergunta guarda apenas a referência 'ref:<docId>'.
function pqMidiaId(formId, perguntaId) { return String(formId) + '__' + String(perguntaId); }
function pqEhRef(u) { return typeof u === 'string' && u.indexOf('ref:') === 0; }
function pqRefId(u) { return pqEhRef(u) ? u.slice(4) : ''; }

// Cache em memória: docId → dataUrl (evita releitura a cada re-render)
var _pqMidiaCache = {};

async function pqCarregarMidia(dbRef, docId) {
  if (!docId) return '';
  if (_pqMidiaCache[docId] !== undefined) return _pqMidiaCache[docId];
  if (!dbRef) return '';
  try {
    const d = await dbRef.collection('forms_midias').doc(docId).get();
    const url = (d.exists && d.data().dataUrl) || '';
    _pqMidiaCache[docId] = url;
    return url;
  } catch (e) {
    console.warn('[Midia] falha ao carregar', docId, e && e.message);
    return '';
  }
}

// Resolve o src exibível de uma pergunta ('' | http | data: legado | ref:)
async function pqResolverImagem(dbRef, p) {
  const u = (p && p.imagemUrl) || '';
  if (!u) return '';
  if (pqEhRef(u)) return await pqCarregarMidia(dbRef, pqRefId(u));
  return u; // http(s) ou data: legado embutido
}

/* ===== FIM MODELO v2 ===== */

// ── Tema ──
(function() {
  const t = localStorage.getItem('abcl-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
})();
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = dark ? '🌙 Escuro' : '☀️ Claro';
  localStorage.setItem('abcl-theme', dark ? 'light' : 'dark');
}

// ── Storage ──
const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

// ── Defaults ──
function getDefaultPerguntas() {
  return [

// ── Carregar formulário pelo ?id= da URL ──
// 1) Carrega localmente (instantâneo). 2) Busca a versão publicada no Firebase
// (coleção `forms`) e re-renderiza — é assim que o formulário criado no Admin
// chega aos visitantes em qualquer aparelho.
function _escolherForm(lista, urlId) {
  if (urlId) return lista.find(f => String(f.id) === String(urlId)) || null;
  return lista.find(f => f.id === 'perfil') || lista.find(f => f.ativo) || lista[0] || null;
}

(function carregarFormulario() {
  const urlId = new URLSearchParams(window.location.search).get('id');
  let formData = null;

  try {
    const lista = JSON.parse(localStorage.getItem('abcl-forms-lista') || '[]');
    formData = _escolherForm(lista, urlId);
  } catch(e) {}

  if (!formData) {
    // Fallback padrão caso não exista nada no localStorage
    formData = {
      titulo: 'Perfil do Acampante',
      subtitulo: 'Conte um pouco mais sobre você 🏕️',
      whats: '5531988262599',
      btnLabel: 'Enviar inscrição',
      capa: '',
      perguntas: getDefaultPerguntas(),
    };
  }

  // Expor como constantes globais usadas pelo restante do código
  window.CONFIG    = formData;
  // Normalização v2 em memória (o formulário público NUNCA reescreve a config;
  // a migração persistente acontece no admin ao abrir o formulário).
  window.PERGUNTAS = pqNormalizarPerguntas(
    (formData.perguntas && formData.perguntas.length > 0) ? formData.perguntas : getDefaultPerguntas()
  ).perguntas;

  // 2) Versão publicada no Firebase (fonte da verdade para visitantes)
  if (window._fdb) (async () => {
    try {
      let remoto = null;
      if (urlId) {
        const doc = await _fdb.collection('forms').doc(String(urlId)).get();
        if (doc.exists && !doc.data().excluido) remoto = doc.data();
      } else {
        const snap = await _fdb.collection('forms').get();
        const vivos = snap.docs.map(d => d.data()).filter(f => !f.excluido);
        remoto = _escolherForm(vivos, null);
      }
      // Só re-renderiza se achou algo e o visitante ainda não começou a responder
      if (remoto && Object.keys(respostas).length === 0) {
        window.CONFIG    = remoto;
        window.PERGUNTAS = pqNormalizarPerguntas(
          (remoto.perguntas && remoto.perguntas.length > 0) ? remoto.perguntas : getDefaultPerguntas()
        ).perguntas;
        montarFormulario();
        atualizarTotalFinanceiro();
      }
    } catch (e) { console.warn('[Form] usando versão local (Firebase indisponível)', e.message); }
  })();
})();

// ── Respostas coletadas ──
const respostas = {};

// ── Montar formulário ──
function montarFormulario() {
  document.getElementById('f-titulo').textContent    = CONFIG.titulo    || 'Formulário';
  document.getElementById('f-subtitulo').textContent = CONFIG.subtitulo || '';
  document.getElementById('top-titulo').textContent  = CONFIG.titulo    || 'ABCL';
  document.getElementById('btn-label').textContent   = CONFIG.btnLabel  || 'Enviar inscrição';

  // Capa do topo — idempotente: montarFormulario() roda 2x (cache + Firestore),
  // então removemos a capa anterior antes de reinserir, senão ela duplica.
  const capaAntiga = document.getElementById('capa-topo');
  if (capaAntiga) capaAntiga.remove();
  if (CONFIG.capa) {
    const img = document.createElement('img');
    img.src = CONFIG.capa; img.className = 'capa-img'; img.id = 'capa-topo';
    document.getElementById('form-header').insertAdjacentElement('beforebegin', img);
  }

  // Janela de agendamento: fora dela, bloqueia e nem monta o formulário
  if (_bloquearForaDeJanela()) return;

  // Formulário real (com id) mas sem nenhuma pergunta → em construção (não cai nos padrões)
  if (CONFIG.id && (!CONFIG.perguntas || CONFIG.perguntas.length === 0)) {
    document.querySelectorAll('#form-body, .form-header, #submit-area, #fin-total-bar').forEach(el => { if (el) el.style.display = 'none'; });
    const s = document.getElementById('sucesso');
    s.classList.add('show');
    s.innerHTML = `
      <div style="font-size:3rem;margin-bottom:1rem;">🚧</div>
      <div style="font-family:'Cinzel',serif;font-size:1.25rem;color:var(--verde-cl);margin-bottom:.6rem;">Formulário em construção</div>
      <p style="font-size:.88rem;color:var(--suave);line-height:1.7;max-width:380px;margin:0 auto;">Este formulário ainda não tem perguntas configuradas. Volte em breve.</p>
      <a href="index.html" style="display:block;margin-top:1.25rem;color:var(--verde-cl);font-size:.78rem;text-decoration:none;">← Voltar ao site</a>
    `;
    return;
  }

  const body = document.getElementById('form-body');
  body.innerHTML = '';

  PERGUNTAS.forEach((p, i) => {
    if (p.tipo === 'secao') {
      const el = document.createElement('div');
      el.className = 'form-secao';
      el.innerHTML = `
        <div class="secao-titulo">${p.label || ''}</div>
        ${p.desc ? `<div class="secao-desc">${p.desc}</div>` : ''}
      `;
      body.appendChild(el);
      return;
    }

    if (p.tipo === 'imagem') {
      if (!p.imagemUrl) return;
      const el = document.createElement('div');
      el.id = `wrap-${p.id}`;
      el.style.marginBottom = '1rem';
      el.innerHTML = `<div class="pq-img-slot" id="pq-img-${p.id}"></div>`;
      body.appendChild(el);
      return;
    }

    const secao = document.createElement('div');
    secao.className = 'form-secao';
    secao.id = `wrap-${p.id}`;
    secao.innerHTML = `
      <div class="campo" id="campo-${p.id}">
        <div class="campo-label">
          ${p.label}
          ${p.obrig ? '<span class="req">*</span>' : ''}
        </div>
        ${p.desc ? `<div class="campo-desc">${p.desc}</div>` : ''}
        <div class="pq-img-slot" id="pq-img-${p.id}"></div>
        <div id="input-wrap-${p.id}">${renderCampo(p)}</div>
        <div class="aviso-regra" id="regra-${p.id}"></div>
        <div class="erro-msg" id="erro-${p.id}">Campo obrigatório.</div>
      </div>
    `;
    body.appendChild(secao);
  });

  _renderTermo(body);
  restaurarRespostasNoDom();
  aplicarCondicionais();
  atualizarTotalFinanceiro();
  atualizarProgresso();
  ajustarTopProgresso();
  carregarImagensPerguntas();
}

// montarFormulario() pode rodar mais de uma vez (cache local e depois a versao
// publicada no Firestore). O DOM e reconstruido do zero, entao repintamos o que
// ja estava respondido — senao a selecao some da tela mas continua no estado.
function restaurarRespostasNoDom() {
  PERGUNTAS.forEach(p => {
    if (pqEhConteudo(p.tipo)) return;
    if (p.tipo === 'radio' || p.tipo === 'checkbox') { _repintarOpcoes(p); return; }
    if (p.tipo === 'select') {
      const el = document.getElementById(`inp-${p.id}`);
      if (el) el.value = _idsSel(p.id)[0] || '';
      return;
    }
    const el = document.getElementById(`inp-${p.id}`);
    if (el && respostas[p.id] !== undefined) el.value = respostas[p.id];
  });
}

// ── Imagens de pergunta (docs separados em `forms_midias`) ──
// Carregadas DEPOIS da montagem e em paralelo: o formulário aparece na hora e
// as imagens entram conforme chegam. Se falhar (offline), o campo funciona igual.
function carregarImagensPerguntas() {
  PERGUNTAS.forEach(async p => {
    if (!p.imagemUrl) return;
    const slot = document.getElementById(`pq-img-${p.id}`);
    if (!slot || slot.dataset.pronto === '1') return;
    const src = await pqResolverImagem(window._fdb, p);
    if (!src) return;
    slot.dataset.pronto = '1';
    slot.innerHTML = `<img src="${src}" alt="" class="pq-img" loading="lazy" />`;
  });
}

function mascararTelefone(el) {
  const v = el.value.replace(/\D/g, '').slice(0, 11); // só dígitos, máx 11
  let out = '';
  if (v.length === 0)      out = '';
  else if (v.length <= 2)  out = `(${v}`;
  else if (v.length <= 6)  out = `(${v.slice(0,2)}) ${v.slice(2)}`;
  else if (v.length <= 10) out = `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`;   // fixo (XX) XXXX-XXXX
  else                     out = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;   // celular (XX) XXXXX-XXXX
  el.value = out;
}

// ══════════════════════════════════════════════════════════════
// NÚCLEO v2 — render de campos, regras de seleção, condicionais e financeiro
// ══════════════════════════════════════════════════════════════

// `respostas`  → { perguntaId: "Texto A, Texto B" }  (rótulos — vai para o registro)
// `selecoes`   → { perguntaId: ["o_ab12", ...] }     (ids — base das regras/condicionais)
const selecoes = {};
window.respostas = respostas;   // atalho de depuracao no console do navegador
window.selecoes  = selecoes;

function _pqPorId(id) { return PERGUNTAS.find(p => String(p.id) === String(id)) || null; }
function _opcPorId(p, oid) { return (p.opcoes || []).find(o => o.id === oid) || null; }
function _idsSel(pid) { return selecoes[pid] || []; }

function _sincronizarTextos(p) {
  const textos = _idsSel(p.id).map(oid => (_opcPorId(p, oid) || {}).texto || '').filter(Boolean);
  respostas[p.id] = textos.join(', ');
}

function renderCampo(p) {
  if (p.tipo === 'texto') {
    return `<input type="text" id="inp-${p.id}" placeholder="${escapar(p.placeholder||'')}"
      oninput="salvarResposta(${p.id},this.value);aoMudarResposta()" />`;
  }
  if (p.tipo === 'numero') {
    return `<input type="number" id="inp-${p.id}" placeholder="${escapar(p.placeholder||'')}"
      oninput="salvarResposta(${p.id},this.value);aoMudarResposta()" />`;
  }
  if (p.tipo === 'data') {
    return `<input type="date" id="inp-${p.id}"
      oninput="salvarResposta(${p.id},this.value);aoMudarResposta()" />`;
  }
  if (p.tipo === 'horario') {
    return `<input type="time" id="inp-${p.id}"
      oninput="salvarResposta(${p.id},this.value);aoMudarResposta()" />`;
  }
  if (p.tipo === 'telefone') {
    return `<input type="tel" inputmode="numeric" id="inp-${p.id}" placeholder="${escapar(p.placeholder||'(31) 99999-9999')}"
      oninput="mascararTelefone(this);salvarResposta(${p.id},this.value);aoMudarResposta()" />`;
  }
  if (p.tipo === 'textarea') {
    return `<textarea id="inp-${p.id}" placeholder="${escapar(p.placeholder||'')}"
      oninput="salvarResposta(${p.id},this.value);aoMudarResposta()"></textarea>`;
  }
  if (p.tipo === 'select') {
    // value = id da opção (estável); o rótulo é resolvido na hora de salvar
    const opts = (p.opcoes||[]).map(o =>
      `<option value="${escapar(o.id)}">${escapar(o.texto)}${o.valorCent ? ` — R$ ${pqFmtBRL(o.valorCent)}` : ''}</option>`).join('');
    return `<select id="inp-${p.id}" onchange="selecionarSelect(${p.id},this.value)">
      <option value="">Selecione...</option>${opts}</select>`;
  }
  if (p.tipo === 'radio' || p.tipo === 'checkbox') {
    const marca = p.tipo === 'radio' ? 'opcao-dot' : 'opcao-box';
    return `<div class="opcoes" id="opc-${p.id}">
      ${(p.opcoes||[]).map(o => `
        <label class="opcao-item" data-oid="${escapar(o.id)}"
               onclick="selecionarOpcao(${p.id},'${escapar(o.id)}',this)"
               style="display:flex;align-items:center;gap:.6rem;">
          <div class="${marca}"></div>
          <span style="flex:1;">${escapar(o.texto)}</span>
          ${(p.comValor && o.valorCent > 0)
            ? `<span style="font-weight:700;color:var(--verde-cl);white-space:nowrap;">R$ ${pqFmtBRL(o.valorCent)}</span>`
            : ''}
        </label>`).join('')}
    </div>`;
  }
  return '';
}

// ── Regras de seleção (exclusividade + máximo) ──
// exclusiva  : marcar uma opção exclusiva limpa todas as outras;
//              marcar uma comum limpa as exclusivas.
// maxSelecoes: teto de opções NÃO exclusivas marcadas simultaneamente.
function _aplicarRegrasSelecao(p, oid) {
  const opc  = _opcPorId(p, oid);
  if (!opc) return { ids: _idsSel(p.id), aviso: '' };
  let ids = _idsSel(p.id).slice();
  const jaTinha = ids.indexOf(oid) >= 0;
  let aviso = '';

  if (jaTinha) return { ids: ids.filter(x => x !== oid), aviso: '' };

  if (opc.exclusiva) {
    ids = [oid];                                   // exclusiva zera o resto
  } else {
    ids = ids.filter(x => !((_opcPorId(p, x)||{}).exclusiva));  // limpa exclusivas
    const max = p.regras && p.regras.maxSelecoes;
    if (max && ids.length >= max) {
      aviso = `Você pode selecionar no máximo ${max} ${max === 1 ? 'opção' : 'opções'} nesta pergunta.`;
      return { ids: _idsSel(p.id), aviso };
    }
    ids.push(oid);
  }
  return { ids, aviso };
}

function _repintarOpcoes(p) {
  const wrap = document.getElementById(`opc-${p.id}`);
  if (!wrap) return;
  const ids = _idsSel(p.id);
  const max = p.regras && p.regras.maxSelecoes;
  const comuns = ids.filter(x => !((_opcPorId(p, x)||{}).exclusiva)).length;
  wrap.querySelectorAll('.opcao-item').forEach(el => {
    const oid = el.dataset.oid;
    const sel = ids.indexOf(oid) >= 0;
    el.classList.toggle('sel', sel);
    const box = el.querySelector('.opcao-box');
    if (box) box.textContent = sel ? '✓' : '';
    // Esmaece o que ficou indisponível pelo teto (só sinaliza; o clique ainda avisa)
    const bloq = !!(max && !sel && comuns >= max && !((_opcPorId(p, oid)||{}).exclusiva));
    el.classList.toggle('bloqueada', bloq);
  });
}

function selecionarOpcao(id, oid, el) {
  const p = _pqPorId(id);
  if (!p) return;

  if (p.tipo === 'radio') {
    selecoes[p.id] = [oid];
  } else {
    const r = _aplicarRegrasSelecao(p, oid);
    selecoes[p.id] = r.ids;
    const av = document.getElementById(`regra-${p.id}`);
    if (av) { av.textContent = r.aviso; av.style.display = r.aviso ? 'block' : 'none'; }
    if (r.aviso) setTimeout(() => { if (av) { av.textContent=''; av.style.display='none'; } }, 3500);
  }

  _sincronizarTextos(p);
  _repintarOpcoes(p);
  document.getElementById(`campo-${p.id}`)?.classList.remove('erro');
  aoMudarResposta();
}

function selecionarSelect(id, oid) {
  const p = _pqPorId(id);
  if (!p) return;
  selecoes[p.id] = oid ? [oid] : [];
  _sincronizarTextos(p);
  document.getElementById(`campo-${p.id}`)?.classList.remove('erro');
  aoMudarResposta();
}

// ── Condicionais ──
// Uma pergunta com `condicao` só aparece se a pergunta-pai tiver alguma das
// opções listadas marcada (ou, quando `negar`, se NÃO tiver).
// Se a pergunta-pai estiver ela própria oculta, a filha também fica oculta.
function _condicaoAtendida(p, profundidade) {
  if (!p.condicao || !p.condicao.perguntaId) return true;
  if ((profundidade || 0) > 10) return true;            // trava anti-ciclo
  const pai = _pqPorId(p.condicao.perguntaId);
  if (!pai) return true;                                // pai apagado → não esconde
  if (!_condicaoAtendida(pai, (profundidade || 0) + 1)) return false;

  const alvo = p.condicao.opcoes || [];
  let bate;
  if (alvo.length === 0) {
    bate = !!(respostas[pai.id] && String(respostas[pai.id]).trim());  // "se respondida"
  } else {
    const sel = _idsSel(pai.id);
    bate = alvo.some(oid => sel.indexOf(oid) >= 0);
  }
  return p.condicao.negar ? !bate : bate;
}

function perguntaVisivel(p) { return _condicaoAtendida(p, 0); }

// Mostra/esconde e LIMPA a resposta do que ficou oculto.
// Limpar é essencial: sem isso o envio carrega resposta de pergunta que a
// pessoa não viu — e, se ela for financeira, cobra por ela.
function aplicarCondicionais() {
  let limpou = false;
  PERGUNTAS.forEach(p => {
    const wrap = document.getElementById(`wrap-${p.id}`);
    if (!wrap) return;
    const vis = perguntaVisivel(p);
    wrap.style.display = vis ? '' : 'none';
    if (vis) return;

    if (respostas[p.id] !== undefined || (selecoes[p.id] || []).length) limpou = true;
    delete respostas[p.id];
    delete selecoes[p.id];
    const inp = document.getElementById(`inp-${p.id}`);
    if (inp) inp.value = '';
    const opc = document.getElementById(`opc-${p.id}`);
    if (opc) opc.querySelectorAll('.opcao-item').forEach(el => {
      el.classList.remove('sel', 'bloqueada');
      const b = el.querySelector('.opcao-box'); if (b) b.textContent = '';
    });
    document.getElementById(`campo-${p.id}`)?.classList.remove('erro');
  });
  return limpou;
}

// Ponto único chamado após QUALQUER mudança de resposta.
function aoMudarResposta() {
  aplicarCondicionais();
  atualizarTotalFinanceiro();
  atualizarProgresso();
}

// ── Valores monetários ──
function _totalFinanceiroCent() {
  let t = 0;
  PERGUNTAS.forEach(p => {
    if (!p.comValor || !perguntaVisivel(p)) return;   // oculta não soma
    _idsSel(p.id).forEach(oid => { t += (_opcPorId(p, oid) || {}).valorCent || 0; });
  });
  return t;
}

// Barra "Total selecionado" acima do botão de envio (só se houver pergunta com valor)
function atualizarTotalFinanceiro() {
  if (!PERGUNTAS.some(p => p.comValor)) return;
  let bar = document.getElementById('fin-total-bar');
  if (!bar) {
    const sa = document.getElementById('submit-area');
    if (!sa) return;
    sa.insertAdjacentHTML('beforebegin', `
      <div id="fin-total-bar" style="display:flex;justify-content:space-between;align-items:center;background:rgba(64,145,108,.1);border:1px solid rgba(64,145,108,.3);border-radius:10px;padding:.85rem 1.1rem;margin:1rem 0;">
        <span style="font-size:.85rem;color:var(--suave);">💰 Total selecionado</span>
        <strong id="fin-total-valor" style="font-size:1.15rem;color:var(--verde-cl);">R$ 0,00</strong>
      </div>`);
    bar = document.getElementById('fin-total-bar');
  }
  document.getElementById('fin-total-valor').textContent = 'R$ ' + pqFmtBRL(_totalFinanceiroCent());
}

function escapar(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Progresso ──
// Conta apenas obrigatórias VISÍVEIS — senão a barra nunca chega a 100%
// quando existem condicionais que não se aplicam ao respondente.
function atualizarProgresso() {
  const obrigatorias = PERGUNTAS.filter(p => p.obrig && !pqEhConteudo(p.tipo) && perguntaVisivel(p));
  const respondidas  = obrigatorias.filter(p => respostas[p.id] && String(respostas[p.id]).trim());
  const pct = obrigatorias.length ? (respondidas.length / obrigatorias.length) * 100 : 0;
  const fill = document.getElementById('prog-fill');
  if (fill) fill.style.width = pct.toFixed(0) + '%';
}

// A barra de progresso fica colada logo abaixo do top-bar. Como a altura do
// top-bar varia (fonte/tela), medimos a altura real e ajustamos o "top" da
// barra — senão, ao rolar, a barra some atrás do top-bar.
function ajustarTopProgresso() {
  const tb = document.querySelector('.top-bar');
  const pb = document.querySelector('.progress-bar');
  if (tb && pb) pb.style.top = tb.offsetHeight + 'px';
}
window.addEventListener('load',   ajustarTopProgresso);
window.addEventListener('resize', ajustarTopProgresso);

// ── Validação ──
function validar() {
  let ok = true;
  PERGUNTAS.forEach(p => {
    if (pqEhConteudo(p.tipo)) return;
    // Pergunta oculta por condicional nao e validada (e nao tem resposta guardada)
    if (!perguntaVisivel(p)) return;
    if (!p.obrig) return;
    const val = respostas[p.id];
    if (!val || !String(val).trim()) {
      document.getElementById(`campo-${p.id}`)?.classList.add('erro');
      ok = false;
    }
  });
  // Termo de aceite (quando ativo, é obrigatório marcar)
  if (CONFIG.termoAtivo) {
    const chk = document.getElementById('termo-aceite-check');
    if (!chk || !chk.checked) {
      const box = document.getElementById('campo-termo');
      if (box) { box.style.outline = '2px solid #EF4444'; box.style.outlineOffset = '2px'; box.classList.add('erro'); }
      ok = false;
    }
  }
  return ok;
}

// ── Janela de agendamento (ativar/desativar) — espelha _statusAgendamento do admin ──
function _statusFormulario() {
  // 'ativo' | 'agendado' | 'expirado' | 'inativo'
  const agora = new Date();
  const ini = CONFIG.agendaInicio ? new Date(CONFIG.agendaInicio) : null;
  const fim = CONFIG.agendaFim    ? new Date(CONFIG.agendaFim)    : null;
  if (ini && agora < ini) return 'agendado';
  if (fim && agora > fim)  return 'expirado';
  if (ini && agora >= ini && (!fim || agora <= fim)) return 'ativo';
  // Sem janela definida: só bloqueia se o formulário foi explicitamente desativado
  return (CONFIG.ativo === false) ? 'inativo' : 'ativo';
}

function _fmtDataAgenda(iso) {
  try { return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch (e) { return ''; }
}

// Bloqueia a tela quando fora da janela. Retorna true se bloqueou.
function _bloquearForaDeJanela() {
  const s = _statusFormulario();
  if (s === 'ativo') return false;

  let icone, titulo, msg;
  if (s === 'agendado') {
    icone = '🗓️'; titulo = 'As inscrições ainda não abriram';
    msg = CONFIG.agendaInicio ? `As inscrições abrem em <strong>${_fmtDataAgenda(CONFIG.agendaInicio)}</strong>.` : 'Volte em breve.';
  } else if (s === 'expirado') {
    icone = '⏳'; titulo = 'Inscrições encerradas';
    msg = CONFIG.agendaFim ? `O prazo terminou em <strong>${_fmtDataAgenda(CONFIG.agendaFim)}</strong>.` : 'O prazo para este formulário já passou.';
  } else {
    icone = '🔒'; titulo = 'Inscrições indisponíveis';
    msg = 'Este formulário não está aberto no momento.';
  }

  document.querySelectorAll('#form-body, .form-header, #submit-area, #fin-total-bar').forEach(el => { if (el) el.style.display = 'none'; });
  const prog = document.getElementById('prog-fill'); if (prog) prog.style.width = '100%';
  const el = document.getElementById('sucesso');
  el.classList.add('show');
  el.innerHTML = `
    <div style="font-size:3rem;margin-bottom:1rem;">${icone}</div>
    <div style="font-family:'Cinzel',serif;font-size:1.25rem;color:var(--verde-cl);margin-bottom:.6rem;">${titulo}</div>
    <p style="font-size:.88rem;color:var(--suave);line-height:1.7;max-width:380px;margin:0 auto;">${msg}</p>

      style="display:inline-flex;align-items:center;gap:.5rem;margin-top:1.25rem;background:var(--verde-mid);color:#fff;padding:.7rem 1.4rem;border-radius:10px;text-decoration:none;font-weight:600;font-size:.86rem;">💬 Falar com a organização</a>` : ''}
    <a href="index.html" style="display:block;margin-top:1rem;color:var(--verde-cl);font-size:.78rem;text-decoration:none;">← Voltar ao site</a>
  `;
  return true;
}

// ── Envio ──
let _enviando = false;
async function enviarFormulario() {
  if (_enviando) return;                  // trava reentrada (duplo-clique durante a checagem)
  if (_bloquearForaDeJanela()) return;    // janela de agendamento (defesa no submit)
  if (!validar()) {
    const primeiro = document.querySelector('.campo.erro');
    if (primeiro) primeiro.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }

  _enviando = true;
  const btn = document.querySelector('#submit-area button');
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando…'; }

  // ── Verificar vagas disponíveis (contagem global no Firestore) ──
  let vagasStatus = 'ok';
  try { vagasStatus = await verificarVagas(); }
  catch (e) { console.warn('[Form] checagem de vagas falhou, prosseguindo:', (e && e.message) || e); vagasStatus = 'ok'; }

  if (vagasStatus === 'lotado') {
    mostrarLotado(); return;              // tela terminal
  }
  if (vagasStatus === 'fila') {
    enviarComoFila(); return;             // mantém botão travado e mostra sucesso
  }

  _executarEnvio();
}

async function verificarVagas() {
  if (!CONFIG.vagasMasc && !CONFIG.vagasFem && !CONFIG.vagasGeral) return 'ok';
  // Sem Firestore ou sem id não há como contar globalmente → não bloqueia (admin reconcilia).
  if (!window._fdb || !CONFIG.id) return 'ok';

  let confirmadas;
  try {
    // Uma leitura simples por form_id (sem índice composto); filtra a fila no cliente.
    const snap = await _fdb.collection('inscricoes').where('form_id', '==', String(CONFIG.id)).get();
    confirmadas = snap.docs.map(d => d.data()).filter(r => (r.status_inscricao || 'confirmada') !== 'fila');
  } catch (e) {
    console.warn('[Form] não foi possível checar vagas no Firebase, prosseguindo:', (e && (e.code || e.message)) || e);
    return 'ok';
  }

  const total = confirmadas.length;
  const pSexo = PERGUNTAS.find(p => p.label && p.label.toLowerCase().includes('sexo'));
  const sexoAtual = pSexo ? respostas[pSexo.id] : '';

  if (CONFIG.vagasGeral > 0 && total >= CONFIG.vagasGeral) {
    return CONFIG.filaEspera ? 'fila' : 'lotado';
  }
  if (CONFIG.vagasMasc > 0 && sexoAtual === 'Masculino') {
    const masc = confirmadas.filter(r => (r.sexo || '') === 'Masculino').length;
    if (masc >= CONFIG.vagasMasc) return CONFIG.filaEspera ? 'fila' : 'lotado';
  }
  if (CONFIG.vagasFem > 0 && sexoAtual === 'Feminino') {
    const fem = confirmadas.filter(r => (r.sexo || '') === 'Feminino').length;
    if (fem >= CONFIG.vagasFem) return CONFIG.filaEspera ? 'fila' : 'lotado';
  }
  return 'ok';
}

// ══════════════════════════════════════════════════════════════
// GRAVAÇÃO NO FIREBASE — coleções `acampantes` (pessoa, permanente)
// e `inscricoes` (resposta deste formulário). O WhatsApp segue como
// canal de confirmação; o banco é o registro oficial.
// ══════════════════════════════════════════════════════════════
function _soDigitos(s){ return String(s||'').replace(/\D/g,''); }
function _slug(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40); }

// Extrai um campo das respostas procurando palavras-chave no rótulo da pergunta
function _respostaPorLabel(regex) {
  const p = PERGUNTAS.find(p => p.label && regex.test(p.label.toLowerCase()));
  return p ? String(respostas[p.id] || '').trim() : '';
}

function _montarRegistroInscricao() {
  const nome     = _respostaPorLabel(/nome/);
  const telefone = _soDigitos(_respostaPorLabel(/telefone|whatsapp|celular/));
  const email    = _respostaPorLabel(/e-?mail/);
  const sexo     = _respostaPorLabel(/sexo/);

  // Mapa legível: rótulo → resposta (sobrevive a mudanças de ids entre edições)
  const mapa = {};
  PERGUNTAS.forEach(p => {
    if (pqEhConteudo(p.tipo) || !perguntaVisivel(p)) return;
    const r = respostas[p.id];
    if (r !== undefined && String(r).trim() !== '') mapa[p.label] = r;
  });

  // Itens com valor (perguntas do tipo "Vínculo financeiro") → vão para o Financeiro
  const itens_financeiros = [];
  let totalCent = 0;
  PERGUNTAS.forEach(p => {
    if (!p.comValor || !perguntaVisivel(p)) return;   // pergunta oculta não cobra
    _idsSel(p.id).forEach(oid => {
      const o = _opcPorId(p, oid);
      if (!o) return;
      itens_financeiros.push({
        descricao: o.texto,
        valor: (o.valorCent || 0) / 100,
        valor_cent: o.valorCent || 0,
        opcao_id: o.id,                 // chave estável: sobrevive a edição de rótulo
        pergunta_id: p.id,
        pergunta_label: p.label || '',
        destino: p.destinoValor || 'inscricao',
      });
      totalCent += o.valorCent || 0;
    });
  });
  const valor_total = totalCent / 100;

  // Código curto da inscrição (referência para o inscrito e a organização)
  const codigo = 'ABCL-' + Date.now().toString(36).toUpperCase().slice(-5) + Math.floor(Math.random()*10);

  // Chave de IDEMPOTÊNCIA: id único e imprevisível do documento da inscrição.
  // Usada como id do doc no Firestore → reenvio (após timeout) sobrescreve o
  // MESMO doc em vez de criar duplicata. Gerada uma vez e preservada na fila offline.
  const idem = (self.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : ('i-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,12) + Math.random().toString(36).slice(2,12));

  // Chave do acampante: telefone + nome (telefone pode ser compartilhado — ex.: menor usa o do responsável)
  const acampanteId = (telefone || nome) ? `a${telefone || 'x'}_${_slug(nome) || 'sem-nome'}` : null;

  // Aceite do termo (quando o formulário tem termo ativo)
  const aceiteTermo = CONFIG.termoAtivo ? !!document.getElementById('termo-aceite-check')?.checked : null;

  return { nome, telefone, email, sexo, mapa, acampanteId, itens_financeiros, valor_total, codigo, idem, aceiteTermo };
}

async function _gravarNoFirebase(reg, status) {
  if (!window._fdb) return;
  const FV = firebase.firestore.FieldValue;

  // 1) INSCRIÇÃO primeiro — registro oficial da resposta.
  //    Id determinístico (idem) → se ESTA falhar (offline/permissão), o erro
  //    propaga e o chamador põe na fila; ao reenviar, sobrescreve o MESMO doc
  //    em vez de duplicar. Itens legados (sem idem) usam uma chave estável.
  const idDoc = reg.idem || ('legacy-' + (reg.codigo || Date.now()) + '-' + (reg.telefone || 'x'));
  await _fdb.collection('inscricoes').doc(idDoc).set({
    idem: idDoc,
    codigo: reg.codigo || null,
    form_id: String(CONFIG.id || 'sem-id'),
    form_titulo: CONFIG.titulo || '',
    acampante_id: reg.acampanteId || null,
    nome: reg.nome, telefone: reg.telefone, email: reg.email || null, sexo: reg.sexo || null,
    respostas: reg.mapa,
    itens_financeiros: reg.itens_financeiros || [],
    valor_total: reg.valor_total || 0,
    status_pagamento: 'pendente',
    forma_pagamento: (reg.mapa['Pagamento - Dinheiro ou PIX?'] || _respostaPorLabel(/pagamento/) || null),
    status_inscricao: status || 'confirmada',   // 'confirmada' | 'fila'
    origem: 'formulario',
    aceite_termo: (reg.aceiteTermo === undefined ? null : reg.aceiteTermo),
    criado_em: FV.serverTimestamp(),
  });

  // 2) ACAMPANTE — upsert do cadastro permanente, SÓ com identificador (nome/telefone)
  //    e em BEST-EFFORT: se falhar, a inscrição já está salva — apenas loga, sem
  //    derrubar o envio nem reprocessar (evita inscrição duplicada na fila).
  if (reg.acampanteId) {
    try {
      await _fdb.collection('acampantes').doc(reg.acampanteId).set({
        nome: reg.nome, nome_busca: _slug(reg.nome),
        telefone: reg.telefone, email: reg.email || null, sexo: reg.sexo || null,
        dados: reg.mapa,
        atualizado_em: FV.serverTimestamp(),
      }, { merge: true });
    } catch (e) {
      console.error('[Form] Inscrição gravada, mas falhou ao atualizar o cadastro do acampante:', (e && (e.code || e.message)) || e);
    }
  }
}

// Reenvia pendências ao abrir a página
(function _retomarPendentes() {
  if (!window._fdb) return;
  let fila = [];
  try { fila = JSON.parse(localStorage.getItem('abcl-inscricoes-pendentes') || '[]'); } catch(_) {}
  if (!fila.length) return;
  (async () => {
    const restantes = [];
    for (const item of fila) {
      try { await _gravarNoFirebase(item.reg, item.status); }
      catch (e) { console.error('[Form] Pendente ainda falhando:', (e && (e.code || e.message)) || e); restantes.push(item); }
    }
    localStorage.setItem('abcl-inscricoes-pendentes', JSON.stringify(restantes));
    if (restantes.length < fila.length) console.log(`[Form] ${fila.length - restantes.length} inscrição(ões) pendente(s) enviada(s).`);
  })();
})();

async function _executarEnvio() {
  _salvarInsight(false);
  const reg = _montarRegistroInscricao();
  const btn = document.querySelector('#submit-area button');
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
  let online = true;
  try { await _gravarNoFirebase(reg, 'confirmada'); }
  catch (e) {
    online = false;
    console.error('[Form] Falha ao gravar no Firebase:', (e && (e.code || e.message)) || e, e);
    if (e && e.code === 'permission-denied') console.error('[Form] ⚠️ permission-denied: as regras do Firestore não permitem escrita pública em acampantes/inscricoes.');
    try {
      const fila = JSON.parse(localStorage.getItem('abcl-inscricoes-pendentes') || '[]');
      fila.push({ reg, status: 'confirmada', em: Date.now() });
      localStorage.setItem('abcl-inscricoes-pendentes', JSON.stringify(fila));
    } catch (_) {}
  }
  _mostrarSucesso(reg, online, false);
}
